site_name: 'Sterling Microsoft Graph SDK Java'
site_description: 'Aplicación Java para procesar adjuntos de correos de Office 365 usando Microsoft Graph API'

nav:
  - Home: index.md
  - Changelog: CHANGELOG.md
  - Configuración: DELETED_ITEMS_CONFIGURATION.md
  - Diseño:
    - Requisitos: design/requirements.md
    - Arquitectura: design/architecture.md
    - Decisiones: design/decisions.md
  - Build:
    - Guía de Build: build/build-guide.md
    - Desarrollo: build/development.md
    - Instalación: build/installation.md
  - Implementación:
    - Deployment: implementation/deployment-guide.md
    - Uso: implementation/usage.md
  - Soporte:
    - Troubleshooting: support/troubleshooting.md
    - API Reference: support/api.md
    - Postman: support/postman.md

plugins:
  - techdocs-core
  - search

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

repo_url: https://github.com/giovanemere/sterling-msgraph-sdk-java
edit_uri: edit/master/docs/

extra:
  version:
    provider: mike
  generator: false
