# Build, tests y análisis de seguridad (main + semanal sin skip OWASP/SpotBugs)
name: O365 CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests
        run: mvn -B clean test -Ddependency-check.skip=true -Dspotbugs.skip=true

      - name: Package (shade JAR)
        run: mvn -B package -DskipTests -Ddependency-check.skip=true -Dspotbugs.skip=true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: o365-jar
          path: target/O365InboxAttachmentToDisk-*.jar
          if-no-files-found: error

  security:
    name: OWASP + SpotBugs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP Dependency-Check
        run: mvn -B dependency-check:check -Dspotbugs.skip=true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: SpotBugs
        run: mvn -B compile spotbugs:check -Ddependency-check.skip=true
